name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]          # 기본 브랜치 이름이 다르면 수정
  workflow_dispatch:            # Actions 탭에서 수동 실행
  # 미래 날짜 글을 정해진 시간에 공개하려면 아래 주석을 풀고 사용 (cron은 UTC 기준)
  # schedule:
  #   - cron: "10 15 * * *"     # 매일 한국 시간 00:10

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.0     # 로컬 `hugo version`과 같은 값으로 맞출 것 (nuno는 extended 0.158 이상)
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # themes/nuno 서브모듈
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

